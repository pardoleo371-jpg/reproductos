<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mi Reproductor de Música</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins', sans-serif;
}

body{
    background:linear-gradient(135deg,#ff0080,#7928ca,#00c6ff);
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
}

.player{
    width:360px;
    background:rgba(255,255,255,0.12);
    backdrop-filter:blur(18px);
    border:1px solid rgba(255,255,255,0.25);
    padding:25px;
    border-radius:30px;
    text-align:center;
    box-shadow:0 10px 35px rgba(0,0,0,.4);
    color:white;
}

h1{
    color:#fff;
    margin-bottom:15px;
    font-size:30px;
    text-shadow:0 0 10px rgba(255,255,255,.7);
}

#songName{
    margin:15px 0;
    font-size:20px;
    font-weight:bold;
    color:#fff;
}

button{
    padding:12px 18px;
    margin:6px;
    border:none;
    border-radius:18px;
    cursor:pointer;
    font-size:18px;
    background:linear-gradient(135deg,#ff4ecd,#ff9800);
    color:white;
    transition:.3s;
    box-shadow:0 5px 20px rgba(255,152,0,.5);
}

button:hover{
    transform:scale(1.1);
    box-shadow:0 8px 25px rgba(255,0,128,.6);
}

input[type="range"]{
    width:100%;
    margin:12px 0;
    accent-color:#ff4ecd;
}

.playlist{
    margin-top:20px;
    text-align:left;
    background:rgba(255,255,255,0.08);
    border-radius:18px;
    padding:10px;
}

.playlist ul{
    list-style:none;
}

.playlist li{
    padding:10px;
    cursor:pointer;
    border-radius:12px;
    margin-bottom:6px;
    transition:.3s;
    color:#fff;
}

.playlist li:hover{
    background:rgba(255,255,255,.2);
    transform:translateX(6px);
}
</style>
</head>
<body>

<div class="player">

    <h1>🎵 Mi Música</h1>

    <p id="songName">Selecciona una canción</p>

    <audio id="audio"></audio>

    <input type="range" id="progress" value="0">

    <div>
        <button onclick="anterior()">⏮</button>
        <button onclick="playPause()">▶ / ⏸</button>
        <button onclick="siguiente()">⏭</button>
    </div>

    <div class="playlist">
        <h3>Lista de canciones</h3>
        <ul id="lista"></ul>
    </div>

</div>

<script>

const canciones = [
    {
        nombre: "Canción 1",
        archivo: "musica/10.mp3"
    },
    {
        nombre: "Canción 2",
        archivo: "musica/9.mp3"
    },
    ,
    {
        nombre: "Canción 3",
        archivo: "musica/8.mp3"
    },
    ,
    {
        nombre: "Canción 4",
        archivo: "4.mp3"
    },
    ,
    {
        nombre: "Canción 5",
        archivo: "musica/6.mp3"
    },
    ,
    {
        nombre: "Canción 6",
        archivo: "musica/5.mp3"
    },
    ,
    {
        nombre: "Canción 7",
        archivo: "musica/7.mp3"
    },
    ,
    {
        nombre: "Canción 8",
        archivo: "musica/3.mp3"
    },
    ,
    {
        nombre: "Canción 9",
        archivo: "musica/2.mp3"
    },
    {
        nombre: "Canción 10",
        archivo: "musica/1.mp3"
    }
];

const audio = document.getElementById("audio");
const songName = document.getElementById("songName");
const progress = document.getElementById("progress");
const lista = document.getElementById("lista");

let indice = 0;

function cargarCancion(i){
    indice = i;
    audio.src = canciones[i].archivo;
    songName.textContent = canciones[i].nombre;
}

function playPause(){
    if(audio.paused){
        audio.play();
    }else{
        audio.pause();
    }
}

function siguiente(){
    indice++;
    if(indice >= canciones.length){
        indice = 0;
    }
    cargarCancion(indice);
    audio.play();
}

function anterior(){
    indice--;
    if(indice < 0){
        indice = canciones.length - 1;
    }
    cargarCancion(indice);
    audio.play();
}

audio.addEventListener("timeupdate",()=>{
    progress.max = audio.duration;
    progress.value = audio.currentTime;
});

progress.addEventListener("input",()=>{
    audio.currentTime = progress.value;
});

audio.addEventListener("ended",()=>{
    siguiente();
});

canciones.forEach((cancion,index)=>{
    const li = document.createElement("li");
    li.textContent = cancion.nombre;
    li.onclick = ()=>{
        cargarCancion(index);
        audio.play();
    };
    lista.appendChild(li);
});

cargarCancion(0);

</script>

</body>
</html>
