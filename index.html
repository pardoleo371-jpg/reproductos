<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reproductor de Música</title>

<style>
body{
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg,#1e3c72,#2a5298);
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
    margin:0;
}

.player{
    background:white;
    padding:30px;
    border-radius:20px;
    text-align:center;
    width:300px;
    box-shadow:0 0 20px rgba(0,0,0,0.3);
}

img{
    width:200px;
    height:200px;
    border-radius:15px;
    object-fit:cover;
}

h2{
    margin:15px 0;
}

button{
    padding:10px 20px;
    margin:10px;
    border:none;
    border-radius:10px;
    background:#2a5298;
    color:white;
    cursor:pointer;
    font-size:16px;
}

button:hover{
    background:#1e3c72;
}

input[type="range"]{
    width:100%;
}
</style>
</head>
<body>

<div class="player">
    <img src="portada.jpg" alt="Portada">

    <h2>Mi Canción</h2>

    <audio id="audio">
        <source src="musica.mp3" type="audio/mpeg">
    </audio>

    <input type="range" id="barra" value="0">

    <br>

    <button onclick="playMusic()">▶</button>
    <button onclick="pauseMusic()">⏸</button>
</div>

<script>
const audio = document.getElementById("audio");
const barra = document.getElementById("barra");

function playMusic(){
    audio.play();
}

function pauseMusic(){
    audio.pause();
}

audio.addEventListener("timeupdate", () => {
    barra.max = audio.duration;
    barra.value = audio.currentTime;
});

barra.addEventListener("input", () => {
    audio.currentTime = barra.value;
});
</script>

</body>
</html>
